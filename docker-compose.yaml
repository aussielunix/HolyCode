# HolyCode - Quick Start
# Usage: docker compose up -d
# Web UI: http://localhost:4096

services:
  holycode:
    image: ghcr.io/aussielunix/holycode:latest
    container_name: holycode
    restart: unless-stopped
    shm_size: 2g
    security_opt:
      - seccomp=./config/chromium-seccomp.json
    ports:
      - "4096:4096"
    volumes:
      - ./data/agent1:/home/agent1
      - ./local-cache/agent1:/home/agent1/.cache/opencode
      - ./workspace:/home/agent1/Code
    environment:
      - PUID=1000
      - PGID=1000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
